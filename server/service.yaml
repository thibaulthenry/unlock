# Knative manifest pour Cloud Run.
# Utilisé par deploy.sh via `gcloud run services replace` quand on veut
# une configuration source-de-vérité. Les placeholders ${...} sont substitués
# par envsubst dans le script de déploiement.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "${MAX_INSTANCES}"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      containerConcurrency: ${CLOUD_RUN_CONCURRENCY}
      timeoutSeconds: ${CLOUD_RUN_TIMEOUT}
      containers:
        - image: ${IMAGE_URI}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: ${PROJECT_ID}
            - name: ALLOWED_ORIGINS
              value: ${ALLOWED_ORIGINS}
          resources:
            limits:
              cpu: "${CLOUD_RUN_CPU}"
              memory: "${CLOUD_RUN_MEMORY}"
  traffic:
    - latestRevision: true
      percent: 100
